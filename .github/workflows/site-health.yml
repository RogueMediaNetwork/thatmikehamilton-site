name: Website book-cover health

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: thatmikehamilton-site-health
  cancel-in-progress: false

jobs:
  check-book-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every public page and local site asset
        run: node scripts/verify-live-site-assets.mjs

      - name: Open a repair alert if the check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Website book-cover health check needs attention';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The automated check found a missing page or local site asset.',
              '',
              'The Cloudflare worker is serving a branded fallback in place of any missing image, so visitors will not see a broken-image icon.',
              '',
              `Inspect the run: ${runUrl}`,
              'Then restore the missing source asset in `public/assets/` and deploy from GitHub.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'site-health',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['site-health', 'automated-check']
              });
            }
