name: Website book-cover health

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: thatmikehamilton-site-health
  cancel-in-progress: false

jobs:
  check-book-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live bookshelf
        id: health
        shell: bash
        run: |
          set -o pipefail
          report="$(curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 --silent --show-error 'https://thatmikehamilton.com/__site-health')"
          printf '%s\n' "$report"
          printf 'report<<EOF\n%s\nEOF\n' "$report" >> "$GITHUB_OUTPUT"
          echo "$report" | jq -e '.ok == true and .coversChecked >= 6'

      - name: Open a repair alert if the check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Website book-cover health check needs attention';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The automated check could not confirm that all six book covers are healthy.',
              '',
              'The Cloudflare worker is still serving the branded fallback cover in place of any missing book image, so visitors will not see a broken-image icon.',
              '',
              `Inspect the run: ${runUrl}`,
              'Then restore the missing source asset in `public/assets/books/` and deploy from GitHub.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'site-health',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['site-health', 'automated-check']
              });
            }
